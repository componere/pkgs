name: Env secret probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Probe environment secret resolution
    runs-on: ubuntu-24.04
    environment: packages-production
    steps:
      - name: Report secret lengths only
        env:
          GPG_PASSPHRASE: ${{ secrets.PACKAGE_REPOSITORY_GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_REPOSITORY_GPG_PRIVATE_KEY }}
          APK_PRIVATE_KEY: ${{ secrets.PACKAGE_REPOSITORY_APK_PRIVATE_KEY }}
          R2_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          MARKER: ${{ secrets.PACKAGE_REPOSITORY_INHERIT_MARKER }}
        run: |
          printf 'gpg_passphrase_len=%s\n' "${#GPG_PASSPHRASE}"
          printf 'gpg_private_key_len=%s\n' "${#GPG_PRIVATE_KEY}"
          printf 'apk_private_key_len=%s\n' "${#APK_PRIVATE_KEY}"
          printf 'r2_key_id_len=%s\n' "${#R2_KEY_ID}"
          printf 'repo_marker_len=%s\n' "${#MARKER}"
